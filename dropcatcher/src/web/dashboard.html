<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drop Catcher</title>
<style>
  :root {
    --bg: #0b1220; --panel: #131c2e; --panel2: #1a2540; --line: #24314f;
    --text: #e8eefc; --muted: #8fa0c2; --accent: #4f8cff; --good: #34d399;
    --warn: #fbbf24; --bad: #f87171; --catch: #a78bfa;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 22px; display: flex; align-items: center; gap: 10px; }
  h1 .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--bad); }
  h1 .dot.on { background: var(--good); box-shadow: 0 0 10px var(--good); }
  h2 { font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-top: 18px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input, select { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; font-size: 15px; min-width: 0; }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 9px; padding: 10px 16px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button.secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
  button.danger { background: transparent; color: var(--bad); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 13px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 600; }
  .b-active { background: #1b3a2d; color: var(--good); }
  .b-graceOrAutoRenew, .b-redemptionPeriod { background: #3a2f14; color: var(--warn); }
  .b-pendingDelete { background: #3a1a3a; color: var(--catch); }
  .b-droppable, .b-caught { background: #123a2a; color: var(--good); }
  .b-unknown, .b-pendingRestore { background: var(--panel2); color: var(--muted); }
  .muted { color: var(--muted); font-size: 13px; }
  .log { background: #0a0f1c; border-radius: 10px; padding: 12px; font: 12.5px/1.7 ui-monospace, Menlo, monospace; max-height: 300px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
  .log .warn { color: var(--warn); } .log .error { color: var(--bad); } .log .catch { color: var(--catch); font-weight: 700; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 20px; opacity: 0; transition: opacity .3s; pointer-events: none; max-width: 90vw; }
  .toast.show { opacity: 1; }
  .center { max-width: 380px; margin: 12vh auto 0; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } th:nth-child(3), td:nth-child(3) { display: none; } }
  .ok { color: var(--good); } .no { color: var(--muted); }
  label { font-size: 13px; color: var(--muted); display: block; margin: 10px 0 4px; }
  .statusline { display:flex; gap:18px; flex-wrap:wrap; margin-top:6px; font-size:13.5px; color:var(--muted); }
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="toast" class="toast"></div>
<script>
const $ = (s) => document.querySelector(s);
const app = $('#app');
let statusCache = null;

function toast(msg, ms = 3500) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms);
}
async function api(method, path, body) {
  const res = await fetch(path, {
    method, headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin',
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const fmtTime = (iso) => iso ? new Date(iso).toLocaleString() : '—';

/* ---------- screens ---------- */

function renderSetup() {
  app.innerHTML = `
    <div class="center card">
      <h1 style="margin-bottom:6px">🎯 Drop Catcher</h1>
      <p class="hint" style="margin-bottom:16px">First time here — create a password to protect this control panel.</p>
      <input id="pw" type="password" placeholder="Choose a password (8+ characters)" style="width:100%">
      <input id="pw2" type="password" placeholder="Repeat password" style="width:100%;margin-top:8px">
      <button id="go" style="width:100%;margin-top:12px">Create password &amp; enter</button>
    </div>`;
  $('#go').onclick = async () => {
    if ($('#pw').value !== $('#pw2').value) return toast('Passwords do not match.');
    try { await api('POST', '/api/setup', { password: $('#pw').value }); boot(); }
    catch (e) { toast(e.message); }
  };
}

function renderLogin() {
  app.innerHTML = `
    <div class="center card">
      <h1 style="margin-bottom:6px">🎯 Drop Catcher</h1>
      <p class="hint" style="margin-bottom:16px">Enter your control panel password.</p>
      <input id="pw" type="password" placeholder="Password" style="width:100%">
      <button id="go" style="width:100%;margin-top:12px">Log in</button>
    </div>`;
  const go = async () => {
    try { await api('POST', '/api/login', { password: $('#pw').value }); boot(); }
    catch (e) { toast(e.message); }
  };
  $('#go').onclick = go;
  $('#pw').onkeydown = (e) => e.key === 'Enter' && go();
}

function phaseBadge(phase) {
  const labels = {
    unknown: 'checking…', active: 'registered', graceOrAutoRenew: 'expired (grace)',
    redemptionPeriod: 'redemption', pendingRestore: 'restoring', pendingDelete: 'DROP SOON',
    droppable: 'AVAILABLE', caught: 'CAUGHT ✓',
  };
  return `<span class="badge b-${esc(phase)}">${esc(labels[phase] || phase)}</span>`;
}

function renderMain(st) {
  const e = st.engine;
  app.innerHTML = `
    <h1><span class="dot ${e.running ? 'on' : ''}"></span> Drop Catcher
      <span style="flex:1"></span>
      <button id="engineBtn" class="${e.running ? 'danger' : ''}">${e.running ? 'Pause engine' : 'Start engine'}</button>
    </h1>
    <div class="statusline">
      <span>Registrar: <b>${esc(st.registrar)}</b> ${st.hasApiKey ? '<span class="ok">✓ key saved</span>' : '<span class="no">— no API key yet</span>'}</span>
      <span>Alerts: ${st.notifications.telegram ? '<span class="ok">Telegram ✓</span>' : ''} ${st.notifications.webhook ? '<span class="ok">Webhook ✓</span>' : ''} ${!st.notifications.telegram && !st.notifications.webhook ? '<span class="no">none set</span>' : ''}</span>
      <span>Last check: ${esc(fmtTime(e.lastSweepAt))}</span>
      ${e.activeBurst ? `<span class="catch" style="color:var(--catch)">⚡ bursting on <b>${esc(e.activeBurst)}</b> <button id="cancelBurst" class="secondary" style="padding:2px 10px;font-size:12px">stop</button></span>` : ''}
      ${e.lastError ? `<span style="color:var(--bad)">⚠ ${esc(e.lastError)}</span>` : ''}
    </div>

    <div class="card">
      <h2>Watch a domain</h2>
      <div class="row">
        <input id="newDomain" placeholder="e.g. tell.me / name.tel / name.africa" style="flex:2;min-width:200px">
        <input id="newMax" type="number" placeholder="Max price $ (default 50)" style="flex:1;min-width:140px">
        <button id="addBtn">Watch it</button>
      </div>
      <p class="hint">The engine checks it hourly, alerts you as it moves toward deletion, and grabs it automatically the moment it drops (if the price is within your max).</p>
      <table>
        <thead><tr><th>Domain</th><th>Status</th><th>Expires</th><th>Last checked</th><th></th></tr></thead>
        <tbody id="rows">
          ${st.domains.map((d) => `
            <tr>
              <td><b>${esc(d.domain)}</b><div class="muted">max $${esc(d.maxPrice)}</div></td>
              <td>${phaseBadge(d.phase)}${d.caughtAt ? `<div class="muted">${esc(fmtTime(d.caughtAt))}</div>` : ''}</td>
              <td class="muted">${d.expirationDate ? esc(new Date(d.expirationDate).toLocaleDateString()) : '—'}</td>
              <td class="muted">${esc(fmtTime(d.lastCheckedAt))}</td>
              <td style="text-align:right;white-space:nowrap">
                <button class="secondary" data-catch="${esc(d.domain)}" style="padding:6px 10px;font-size:13px" title="Poll aggressively right now, ignoring the drop window">Catch now</button>
                <button class="danger" data-del="${esc(d.domain)}" style="padding:6px 10px;font-size:13px">✕</button>
              </td>
            </tr>`).join('') || '<tr><td colspan="5" class="muted">No domains yet — add one above.</td></tr>'}
        </tbody>
      </table>
    </div>

    <div class="card">
      <h2>Settings</h2>
      <div class="grid2">
        <div>
          <label>Dynadot API key ${st.hasApiKey ? '<span class="ok">(saved ✓ — paste again only to change it)</span>' : ''}</label>
          <input id="apiKey" type="password" placeholder="${st.hasApiKey ? '••••••••••••' : 'Paste your Dynadot API key'}" style="width:100%">
          <p class="hint">Get it at dynadot.com → Tools → API. Keep your Dynadot account funded — catches are paid from your balance.</p>
        </div>
        <div>
          <label>Telegram alerts (optional)</label>
          <input id="tgToken" type="password" placeholder="Bot token (from @BotFather)" style="width:100%">
          <input id="tgChat" placeholder="Chat ID (from @userinfobot)" style="width:100%;margin-top:8px">
          <label>Discord/Slack webhook URL (optional)</label>
          <input id="webhook" placeholder="https://discord.com/api/webhooks/…" style="width:100%">
        </div>
      </div>
      <div class="row" style="margin-top:14px">
        <button id="saveBtn">Save settings</button>
        <button id="testBtn" class="secondary">Send test alert</button>
      </div>
    </div>

    <div class="card">
      <h2>Activity</h2>
      <div id="log" class="log">loading…</div>
    </div>`;

  $('#engineBtn').onclick = async () => {
    try { await api('POST', e.running ? '/api/engine/stop' : '/api/engine/start'); refresh(); } catch (er) { toast(er.message); }
  };
  const cb = $('#cancelBurst');
  if (cb) cb.onclick = async () => { await api('POST', '/api/catch/cancel'); toast('Burst cancelled.'); refresh(); };

  $('#addBtn').onclick = async () => {
    const domain = $('#newDomain').value.trim();
    if (!domain) return;
    try {
      await api('POST', '/api/watchlist', { domain, maxPrice: $('#newMax').value || undefined });
      toast(`Watching ${domain} — first check running now.`);
      setTimeout(refresh, 2500); refresh();
    } catch (er) { toast(er.message); }
  };
  $('#newDomain').onkeydown = (ev) => ev.key === 'Enter' && $('#addBtn').click();

  app.querySelectorAll('[data-del]').forEach((b) => b.onclick = async () => {
    if (!confirm(`Stop watching ${b.dataset.del}?`)) return;
    await api('DELETE', '/api/watchlist?domain=' + encodeURIComponent(b.dataset.del)); refresh();
  });
  app.querySelectorAll('[data-catch]').forEach((b) => b.onclick = async () => {
    try { const r = await api('POST', '/api/catch', { domain: b.dataset.catch }); toast(r.message); refresh(); }
    catch (er) { toast(er.message); }
  });

  $('#saveBtn').onclick = async () => {
    const body = {};
    if ($('#apiKey').value.trim()) body.dynadotApiKey = $('#apiKey').value;
    if ($('#tgToken').value.trim()) body.telegramBotToken = $('#tgToken').value;
    if ($('#tgChat').value.trim()) body.telegramChatId = $('#tgChat').value;
    if ($('#webhook').value.trim()) body.webhookUrl = $('#webhook').value;
    if (!Object.keys(body).length) return toast('Nothing to save.');
    try { await api('POST', '/api/settings', body); toast('Saved ✓'); refresh(); } catch (er) { toast(er.message); }
  };
  $('#testBtn').onclick = async () => {
    try { await api('POST', '/api/test-notification'); toast('Test sent — check Telegram/Discord.'); } catch (er) { toast(er.message); }
  };
  refreshLog();
}

/* ---------- polling ---------- */

async function refresh() {
  try {
    const st = await api('GET', '/api/status');
    // Re-render only when something changed, so inputs aren't clobbered mid-typing.
    const sig = JSON.stringify([st.engine, st.domains, st.hasApiKey, st.notifications]);
    if (sig !== statusCache) { statusCache = sig; renderMain(st); }
  } catch (e) {
    if (String(e.message).includes('Not logged in')) { statusCache = null; boot(); }
  }
}
async function refreshLog() {
  const el = $('#log'); if (!el) return;
  try {
    const { entries } = await api('GET', '/api/log');
    const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
    el.innerHTML = entries.map((l) =>
      `<div class="${esc(l.level)}">${esc(l.at.slice(11, 19))}  ${esc(l.msg)}</div>`).join('') || 'no activity yet';
    if (atBottom) el.scrollTop = el.scrollHeight;
  } catch { /* not logged in yet */ }
}

async function boot() {
  const s = await api('GET', '/api/setup-status');
  if (s.needsPassword) return renderSetup();
  if (!s.loggedIn) return renderLogin();
  statusCache = null;
  await refresh();
}
boot();
setInterval(() => { if (statusCache !== null) { refresh(); refreshLog(); } }, 5000);
</script>
</body>
</html>
