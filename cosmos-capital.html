ing money with the expectation of generating a profit or return. Unlike saving (which preserves value), investing grows wealth by putting capital to work. In Cosmos Capital, you invest across stocks, ETFs, bonds, sovereign funds, and planetary economies. The core principle: risk and return are related. Higher potential returns come with higher risk. Diversification — spreading investments across different assets — reduces risk without sacrificing expected returns."},{n:2,title:"Understanding Stocks",desc:"What a stock is, how ownership works, and why prices move.",content:"A stock (or share) represents partial ownership of a company. When you buy SLKT stock, you own a tiny fraction of Silk Road Tech. Stock prices reflect market expectations about future earnings. If investors expect strong growth, prices rise. If outlook worsens, prices fall. In Cosmos Capital, the Economic Governor keeps P/E ratios within realistic bounds, preventing runaway prices. Key drivers: earnings reports, analyst ratings, CEO decisions, and geopolitical events."},{n:3,title:"Reading a Company (P/E, Beta, Dividends)",desc:"Decode the key metrics that tell you if a stock is cheap or expensive.",content:"P/E Ratio (Price-to-Earnings): Stock price divided by annual earnings per share. A P/E of 20 means you pay $20 for every $1 of annual earnings. Lower P/E = cheaper. Beta: Measures volatility relative to the market. Beta 1.8 = moves 80% more than average. High beta = more risk, more reward. Dividend Yield: Annual dividend divided by price. A 4% yield on a $100 stock = $4/year per share. Good for income investors."},{n:4,title:"ETFs & Diversification",desc:"How to invest in hundreds of companies through a single ticker.",content:"An ETF (Exchange-Traded Fund) holds a basket of securities. The GSFE (Global Equity ETF) in Cosmos Capital gives you exposure to 15 Earth companies in one trade. Benefits: instant diversification, low cost (expense ratio), professional rebalancing. Downside: capped upside vs single-stock picks. Dividends from ETF holdings are distributed to your Trading Wallet every 30 turns. Expense ratios are deducted automatically from returns."},{n:5,title:"Loans, Leverage & Risk",desc:"Why borrowing can supercharge returns — or destroy them.",content:"Leverage means using borrowed money to amplify returns. If you borrow $500K at 15% APR and earn 25% on it, you profit the spread. But if your investment drops, losses are magnified AND you still owe interest. In Cosmos Capital, 6 loan tiers are available. The loan accrues interest daily, with payments auto-deducted monthly. Tip: borrow in bull markets, repay before downturns. Never borrow more than you can service from cash flow."},{n:6,title:"Tax Strategy (The Tax Eras)",desc:"How to time your trades around the 8 rotating tax regimes.",content:"Cosmos Capital cycles through 8 tax eras every 60 turns. Capital Gains Tax (CGT) is deducted from your profits when you SELL a position. Strategy: SELL in Capital Gains era (5% CGT) and Low Tax era (10%). HOLD during High Tax era (30%). Build positions in Normal era (20%). Philanthropy donations create multi-turn CGT relief — up to 75% reduction. The Foundation also protects your Savings Wallet from bankruptcy scenarios."},{n:7,title:"Planet Economics",desc:"How planetary markets work, risk premia, and when to invest.",content:"Each planet has its own currency, GDP, risk level, and company set. Currency rates affect USD returns when you buy/sell. Higher-risk planets (Neptune, Uranus) offer bigger swings but extreme volatility. Planetary unlock thresholds gate access by net worth — Mars opens at $5B, Neptune requires $100T. Post-storm on Jupiter is historically the best buying opportunity in the game. Sovereign funds compound daily and offer some of the highest APRs available."},{n:8,title:"Building a Trillion-Dollar Empire",desc:"End-game strategies: tax optimization, planet diversification, and the road to $1T.",content:"Late-game strategy: 1) Maximize
