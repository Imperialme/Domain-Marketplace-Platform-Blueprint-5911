TF (Exchange-Traded Fund) holds a basket of securities. The GSFE (Global Equity ETF) in Cosmos Capital gives you exposure to 15 Earth companies in one trade. Benefits: instant diversification, low cost (expense ratio), professional rebalancing. Downside: capped upside vs single-stock picks. Dividends from ETF holdings are distributed to your Trading Wallet every 30 turns. Expense ratios are deducted automatically from returns."},{n:5,title:"Loans, Leverage & Risk",desc:"Why borrowing can supercharge returns — or destroy them.",content:"Leverage means using borrowed money to amplify returns. If you borrow $500K at 15% APR and earn 25% on it, you profit the spread. But if your investment drops, losses are magnified AND you still owe interest. In Cosmos Capital, 6 loan tiers are available. The loan accrues interest daily, with payments auto-deducted monthly. Tip: borrow in bull markets, repay before downturns. Never borrow more than you can service from cash flow."},{n:6,title:"Tax Strategy (The Tax Eras)",desc:"How to time your trades around the 8 rotating tax regimes.",content:"Cosmos Capital cycles through 8 tax eras every 60 turns. Capital Gains Tax (CGT) is deducted from your profits when you SELL a position. Strategy: SELL in Capital Gains era (5% CGT) and Low Tax era (10%). HOLD during High Tax era (30%). Build positions in Normal era (20%). Philanthropy donations create multi-turn CGT relief — up to 75% reduction. The Foundation also protects your Savings Wallet from bankruptcy scenarios."},{n:7,title:"Planet Economics",desc:"How planetary markets work, risk premia, and when to invest.",content:"Each planet has its own currency, GDP, risk level, and company set. Currency rates affect USD returns when you buy/sell. Higher-risk planets (Neptune, Uranus) offer bigger swings but extreme volatility. Planetary unlock thresholds gate access by net worth — Mars opens at $5B, Neptune requires $100T. Post-storm on Jupiter is historically the best buying opportunity in the game. Sovereign funds compound daily and offer some of the highest APRs available."},{n:8,title:"Building a Trillion-Dollar Empire",desc:"End-game strategies: tax optimization, planet diversification, and the road to $1T.",content:"Late-game strategy: 1) Maximize planet diversification — all 8 planets active. 2) Time large sells during Capital Gains tax eras. 3) Stack philanthropy donations for 75% CGT relief. 4) Deposit into high-yield sovereign funds (Neptune: 28.4% APR). 5) Use bonds as low-risk base — Cosmic bonds yield 18-35%. 6) Own 50%+ in key companies for CEO control. 7) Complete 7-turn streaks for spin tokens. The path from $100B to $1T is through compound growth — let time work for you."}];function _g({onBack:e}){const[t,n]=M.useState(null),[r,i]=M.useState(()=>{try{return JSON.parse(localStorage.getItem("CC_academy")||"[]")}catch{return[]}}),s=l=>{const a=[...new Set([...r,l])];i(a);try{localStorage.setItem("CC_academy",JSON.stringify(a))}catch{}};if(t){const l=Ua.find(u=>u.n===t),a=r.includes(t);return o.jsxs("div",{style:{background:R.bg,minHeight:"100%",paddingBottom:80},children:[o.jsx(mn,{title:`Chapter ${l.n}: ${l.title}`,onBack:()=>n(null)}),o.jsxs("div",{style:{padding:"16px"},children:[o.jsx("div",{style:{background:R.card,borderRadius:14,padding:16,border:"1px solid "+R.border,marginBottom:16,fontSize:13,color:R.sub,lineHeight:1.8},children:l.content}),a?o.jsx("div",{style:{background:"rgba(16,185,129,0.1)",border:"1px solid rgba(16,185,129,0.3)",borderRadius:14,padding:14,textAlign:"center",color:R.green,fontWeight:700},children:"✅ Chapter Completed! +50 points earned."}):o.jsx("button",{onClick:()=>s(t),style:{width:"100%",background:R.green,color:"#fff",border:"none",borderRadius:14,padding:"15px 0",fontWeight:800,fontSize:16,cursor:"pointer"},children:"Mark Complete — Earn 50 pts"})]})]})}return o.jsxs("div",{style:{background:R.bg,minHeight:"100%",paddingBottom:80},children:[o.jsx(mn,{title:"🎓 Academy",onBack:e}),o.jsxs("div",{style:{pad
