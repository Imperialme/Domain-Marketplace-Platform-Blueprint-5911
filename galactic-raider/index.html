<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Cosmos Capital</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #060B14; font-family: system-ui, -apple-system, sans-serif; }
      ::-webkit-scrollbar { display: none; }
      button { outline: none; font-family: inherit; }
      @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.65 } }
      @keyframes spin-wheel { from { transform: rotate(0deg); } to { transform: rotate(var(--spin-deg)); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
